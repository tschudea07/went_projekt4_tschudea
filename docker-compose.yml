services:
  postgres:
    image: postgres:18-alpine
    container_name: operon-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: operon
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Vienna
    volumes:
      - operon_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  operon_postgres_data:
